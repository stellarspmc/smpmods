plugins {
    id "maven-publish"
    id 'net.fabricmc.fabric-loom' version '1.17.14'
    id 'org.jetbrains.kotlin.jvm'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.nucleoid.xyz" }
    maven { url "https://m2.dv8tion.net/releases" }
    maven { url "https://jitpack.io" }
    maven { url "https://repo.opencollab.dev/maven-snapshots" }
    maven { url "https://repo.opencollab.dev/maven-releases" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "org.geysermc.floodgate:api:2.2.5-SNAPSHOT"
    implementation "net.fabricmc:fabric-language-kotlin:1.14.1+kotlin.2.4.20"

    include implementation("eu.pb4:sgui:2.2.0+26.3")
    implementation "eu.pb4:polymer-core:0.18.0+26.3-rc-1"
    implementation "eu.pb4:placeholder-api:3.2.0+26.3"
    implementation "eu.pb4:polymer-resource-pack:0.18.0+26.3-rc-1"

    include implementation("net.dv8tion:JDA:6.4.2") // 2.2MiB
    include "com.neovisionaries:nv-websocket-client:2.14"
    include "org.jetbrains:annotations:26.0.2"

    include "com.fasterxml.jackson.core:jackson-databind:2.18.3" // 1.5 MiB
    include "net.sf.trove4j:core:3.1.0" // 2.2 MiB
    include "org.apache.commons:commons-collections4:4.4" // 656 KiB
    include "com.squareup.okhttp3:okhttp:4.10.0" // 729 KiB
    include "com.fasterxml.jackson.core:jackson-annotations:2.18.3"
    include "com.fasterxml.jackson.core:jackson-core:2.18.3"
    include "com.squareup.okio:okio:3.10.2"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

loom {
    accessWidenerPath = file("src/main/resources/smpmod.classtweaker")
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

kotlin {
    jvmToolchain(25)
}